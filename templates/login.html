<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - RICH TRADER</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="../static/img/Rich_trader.jpeg">

    <!-- Bootstrap e CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="../static/css/login.css">

    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>

    <!-- Container do Login -->
    <div class="login-container">
        <div class="login-card">
            <h2 class="text-center">Login</h2>

            <!-- Formulário de Login -->
            <form id="login-form">
                <div class="mb-3">
                    <label for="email" class="form-label">E-mail:</label>
                    <input type="email" name="email" id="email" class="form-control" required>
                </div>

                <div class="mb-3 position-relative">
                    <label for="senha" class="form-label">Senha:</label>
                    <div class="input-group">
                        <input type="password" name="senha" id="senha" class="form-control" required>
                        <button type="button" class="btn btn-outline-secondary toggle-password" data-target="senha">
                            👁️
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary w-100">Entrar</button>
            </form>

            <!-- Link para Cadastro -->
            <div class="text-center mt-3">
                <p>Ainda não tem uma conta? <a href="register.html">Cadastre-se</a></p>
            </div>
        </div>
    </div>

    <!-- JavaScript do Login -->
    <script src="../static/js/login.js"></script>

</body>
</html>
