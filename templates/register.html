<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - RICH TRADER</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="../static/img/favicon.png">

    <!-- Estilos -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="../static/css/register.css">

    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>

    <!-- Container do Formulário -->
    <div class="register-container">
        <div class="register-card">
            <h2 class="text-center">Cadastro</h2>

            <!-- Formulário de Cadastro -->
            <form id="register-form">
                <div class="mb-3">
                    <label for="nome" class="form-label">Nome Completo:</label>
                    <input type="text" name="nome" id="nome" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label">E-mail:</label>
                    <input type="email" name="email" id="email" class="form-control" required>
                </div>

                <div class="mb-3 position-relative">
                    <label for="senha" class="form-label">Senha:</label>
                    <div class="input-group">
                        <input type="password" name="senha" id="senha" class="form-control" required>
                        <button type="button" class="btn btn-outline-secondary toggle-password" data-target="senha">
                            👁️
                        </button>
                    </div>
                    <div id="password-strength" class="mt-2"></div> <!-- 🔹 Barra de força da senha -->
                </div>
                
                <div class="mb-3 position-relative">
                    <label for="senha-confirm" class="form-label">Confirmar Senha:</label>
                    <div class="input-group">
                        <input type="password" id="senha-confirm" class="form-control" required>
                        <button type="button" class="btn btn-outline-secondary toggle-password" data-target="senha-confirm">
                            👁️
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary w-100">Criar Conta</button>
            </form>

            <!-- Link para Login -->
            <div class="text-center mt-3">
                <p>Já tem uma conta? <a href="login.html">Faça login</a></p>
            </div>
        </div>
    </div>

    <!-- Arquivo JavaScript -->
    <script src="../static/js/register.js"></script>

</body>
</html>
