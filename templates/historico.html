<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Histórico de Operações - RICH TRADER</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="../static/img/favicon.png">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Ícones do Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">

    <!-- SweetAlert2 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">

    <!-- CSS Personalizado -->
    <link rel="stylesheet" href="../static/css/historico.css">
</head>
<body>

    <!-- 🔹 Cabeçalho com Menu Hambúrguer -->
    <header>
        <button id="menu-toggle" class="menu-btn">☰</button>
    </header>

    <!-- 🔹 Sidebar (Menu Lateral) -->
    <nav id="sidebar" class="sidebar">
        <ul>
            <li><a href="../index.html">🏠 Home</a></li>
            <li><a href="grafico.html">📊 Gráficos</a></li>
            <li><a href="dashboard.html">👤 Dashboard</a></li>
            <li><a href="ordens_abertas.html">📈 Ordens Abertas</a></li>
            <li><a href="historico.html" class="active">📜 Histórico</a></li>
            <li><a href="order_book.html">📘 Order Book</a></li>
            <li><a href="login.html">🚪 Logout</a></li>
        </ul>
    </nav>

    <!-- 🔹 Container Principal -->
    <div class="container">
        <h2 class="text-center">📜 Histórico de Operações</h2>

        <!-- Tabela de Histórico -->
        <div class="table-responsive">
            <table class="table table-striped table-bordered text-center">
                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Ativo</th>
                        <th>Preço de Entrada</th>
                        <th>Quantidade</th>
                        <th>Lucro/Prejuízo (€)</th>
                        <th>Comissão (€)</th> <!-- ✅ Nova coluna -->
                        <th>Data de Fechamento</th>
                    </tr>
                </thead>
                <tbody id="tabela-historico">
                    <!-- As ordens fechadas serão inseridas dinamicamente pelo JS -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- JS Personalizado -->
    <script src="../static/js/historico.js"></script>

</body>
</html>
