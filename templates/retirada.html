<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retirada - RICH TRADER</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="../static/img/Rich_trader.jpeg">

    <!-- CSS -->
    <link rel="stylesheet" href="../static/css/retirada.css">

    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>

    <div class="withdraw-container">
        <h2>Solicitação de Retirada</h2>

        <!-- Montante da Retirada -->
        <label for="amount">Valor da Retirada:</label>
        <input type="number" id="amount" min="0.01" step="0.01" placeholder="Digite o valor">

        <!-- IBAN do Usuário -->
        <label for="iban">Seu IBAN (ID Único):</label>
        <input type="text" id="iban" placeholder="Digite seu IBAN">

        <!-- Exibição do Nome Associado ao IBAN -->
        <p id="iban-name" class="hidden"></p>

        <!-- Botão de Envio -->
        <button id="submit-withdraw" disabled>Confirmar Retirada</button>
    </div>

    <!-- JavaScript -->
    <script src="../static/js/retirada.js"></script>

</body>
</html>
